# Baut den headless Service (scoresight-service.spec) als Windows-Bundle.
#
# Der geerbte build.yaml baut ausschliesslich scoresight.spec, also die alte
# Qt-Desktop-App. Fuer src/scoresight/ gab es bisher keinen Binaerbuild.
name: Windows service build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versionsnummer fuer den Installer
        default: "0.0.0"
        type: string
      python-version:
        description: Interpreter, der mit ins Bundle wandert
        default: "3.12"
        type: choice
        options:
          - "3.11"
          - "3.12"
          - "3.13"

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
    permissions:
      contents: read

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: uv installieren
        run: python -m pip install uv

      # --extra ocr zieht tesserocr als vorgebautes win_amd64-Wheel aus den in
      # pyproject.toml hinterlegten URLs. Auf Windows wird also nichts kompiliert.
      - name: Abhaengigkeiten aufloesen
        run: uv sync --locked --extra ocr --extra ndi --python python

      - name: PyInstaller ergaenzen
        run: uv pip install pyinstaller

      - name: Bundle bauen
        run: uv run pyinstaller --clean --noconfirm scoresight-service.spec

      # Ein Bundle, das nicht startet, faellt sonst erst beim Anwender auf.
      - name: Bundle starten
        run: dist\scoresight-service\scoresight-service.exe --help

      - name: Version in die .iss schreiben
        shell: pwsh
        run: |
          (Get-Content -Path scoresight-service.iss -Raw) `
            -replace '@SCORESIGHT_VERSION@', '${{ inputs.version }}' `
            | Out-File -FilePath scoresight-service.iss -Encoding ASCII

      - name: Installer kompilieren
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: scoresight-service.iss
          options: /O+

      - uses: actions/upload-artifact@v7
        with:
          name: scoresight-service-windows-py${{ inputs.python-version }}
          path: dist/scoresight-service
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: scoresight-service-setup
          path: dist/scoresight-service-setup.exe
          retention-days: 90
