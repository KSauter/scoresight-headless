# Baut den headless Service (scoresight-service.spec) als Windows-Bundle.
#
# Der geerbte build.yaml baut ausschliesslich scoresight.spec, also die alte
# Qt-Desktop-App. Fuer src/scoresight/ gab es bisher keinen Binaerbuild.
name: Windows service build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versionsnummer fuer den Installer
        default: "0.0.0"
        type: string
      python-version:
        description: Interpreter, der mit ins Bundle wandert
        default: "3.12"
        type: choice
        options:
          - "3.11"
          - "3.12"
          - "3.13"

permissions:
  contents: read
  actions: read

jobs:
  # Die Tests laufen bei jedem Push auf main ohnehin (tests.yaml). Statt sie
  # hier ein zweites Mal zu starten, wartet der Build auf den Lauf fuer genau
  # diesen Commit und bricht ab, wenn der fehlschlaegt oder fehlt.
  wait-for-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Auf den Tests-Lauf dieses Commits warten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests.yaml \
                     --commit "$GITHUB_SHA" --json status,conclusion,url)
            if [ "$(jq -r 'map(select(.conclusion == "success")) | length' <<<"$runs")" != "0" ]; then
              echo "Tests gruen: $(jq -r 'map(select(.conclusion == "success")) | .[0].url' <<<"$runs")"
              exit 0
            fi
            if [ "$(jq -r 'length' <<<"$runs")" = "0" ]; then
              echo "::error::Kein Tests-Lauf fuer $GITHUB_SHA. Starten mit: gh workflow run tests.yaml --ref $GITHUB_REF_NAME"
              exit 1
            fi
            if [ "$(jq -r 'map(select(.status != "completed")) | length' <<<"$runs")" = "0" ]; then
              echo "::error::Tests fehlgeschlagen: $(jq -r '.[0].url' <<<"$runs")"
              exit 1
            fi
            echo "Tests laufen noch (Versuch $attempt) ..."
            sleep 20
          done
          echo "::error::Tests nach 20 Minuten nicht abgeschlossen"
          exit 1

  build:
    needs: wait-for-tests
    runs-on: windows-latest
    env:
      SCORESIGHT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Die Version steht nirgends im Repo; Paket und Installer bekommen sie aus
      # SCORESIGHT_VERSION, src/scoresight/_version.py ist nur der Platzhalter.
      - name: Version eintragen
        shell: pwsh
        run: |
          Set-Content -Path src/scoresight/_version.py -Encoding ASCII `
            -Value "__version__ = `"$env:SCORESIGHT_VERSION`""

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: uv installieren
        run: python -m pip install uv

      # --extra ocr zieht tesserocr als vorgebautes win_amd64-Wheel aus den in
      # pyproject.toml hinterlegten URLs. Auf Windows wird also nichts kompiliert.
      - name: Abhaengigkeiten aufloesen
        run: uv sync --locked --extra ocr --extra ndi --python python

      - name: PyInstaller ergaenzen
        run: uv pip install pyinstaller

      - name: Bundle bauen
        run: uv run pyinstaller --clean --noconfirm scoresight-service.spec

      # Ein Bundle, das nicht startet, faellt sonst erst beim Anwender auf.
      - name: Bundle starten
        run: dist\scoresight-service\scoresight-service.exe --help

      - name: Version in die .iss schreiben
        shell: pwsh
        run: |
          (Get-Content -Path scoresight-service.iss -Raw) `
            -replace '@SCORESIGHT_VERSION@', $env:SCORESIGHT_VERSION `
            | Out-File -FilePath scoresight-service.iss -Encoding ASCII

      - name: Installer kompilieren
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: scoresight-service.iss
          options: /O+

      - uses: actions/upload-artifact@v7
        with:
          name: scoresight-service-windows-py${{ inputs.python-version }}
          path: dist/scoresight-service
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: scoresight-service-setup
          path: dist/scoresight-service-setup.exe
          retention-days: 90
